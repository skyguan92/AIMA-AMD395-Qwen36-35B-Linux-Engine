name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-safe-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install editable control plane
        run: python -m pip install -e .
      - name: Run release checks
        run: make check
