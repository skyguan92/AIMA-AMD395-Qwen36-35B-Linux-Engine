[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aima-amd395-qwen36-engine"
version = "1.4.0"
description = "Batch-1 Qwen3.6-35B-A3B BF16 inference engine for AMD Ryzen AI Max+ 395"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Jiawei Guan", email = "128683929+skyguan92@users.noreply.github.com"},
]
maintainers = [
  {name = "Jiawei Guan", email = "128683929+skyguan92@users.noreply.github.com"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Approaching-AI/AIMA-AMD395-Qwen36-35B-Linux-Engine"
Repository = "https://github.com/Approaching-AI/AIMA-AMD395-Qwen36-35B-Linux-Engine"
Upstream = "https://github.com/skyguan92/AIMA-AMD395-Qwen36-35B-Linux-Engine"
Issues = "https://github.com/Approaching-AI/AIMA-AMD395-Qwen36-35B-Linux-Engine/issues"
Releases = "https://github.com/skyguan92/AIMA-AMD395-Qwen36-35B-Linux-Engine/releases"
Documentation = "https://github.com/Approaching-AI/AIMA-AMD395-Qwen36-35B-Linux-Engine#readme"
Changelog = "https://github.com/Approaching-AI/AIMA-AMD395-Qwen36-35B-Linux-Engine/blob/main/CHANGELOG.md"

[project.scripts]
aima-engine = "aima_engine.cli:main"

[tool.setuptools.packages.find]
include = ["aima_engine*"]

[tool.ruff]
line-length = 100
target-version = "py310"
